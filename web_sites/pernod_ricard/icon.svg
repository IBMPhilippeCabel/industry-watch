      <stop offset="0%" stop-color="#00205b"/>
      <stop offset="50%" stop-color="#00143a"/>
      <stop offset="100%" stop-color="#000d26"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Fond badge arrondi bleu marine profond Pernod Ricard -->
  <rect width="64" height="64" rx="14" fill="url(#pr-grad)"/>
  
  <!-- Verre à spiritueux / Rocks glass doré avec motif premium -->
