  <rect x="27" y="32" width="10" height="10" rx="2" fill="#ffffff" opacity="0.75" transform="rotate(15 32 37)"/>
  
  <!-- Étoile d'excellence / Signature premium -->
  <polygon points="32,8 33.5,12 37.5,12 34.5,14.5 35.5,18.5 32,16 28.5,18.5 29.5,14.5 26.5,12 30.5,12" fill="url(#gold-grad)"/>
