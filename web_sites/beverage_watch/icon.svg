  <!-- Coupe à cocktail / Martini minimaliste -->
  <path d="M16 18 L48 18 L32 36 Z" fill="url(#glass-grad)" opacity="0.85"/>
  <path d="M14 16 L50 16 L32 38 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Pied et base du verre -->
  <line x1="32" y1="38" x2="32" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="42" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pique / Garnish & Bulle lumineuse -->
  <line x1="22" y1="12" x2="36" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="18" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="40" cy="12" r="1.5" fill="#ffffff" opacity="0.8"/>
