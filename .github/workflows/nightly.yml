name: Nightly site update

on:
  schedule:
    - cron: "0 3 * * *"   # every night at 03:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  # ── Step 1: build matrix of site ids from config.json ────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      site_branch: ${{ steps.read.outputs.site_branch }}
    steps:
      - uses: actions/checkout@v5
      - name: Read config.json
        id: read
        run: |
          python -c "
          import json, os
          cfg = json.load(open('config.json'))
          ids = [s['id'] for s in cfg['sites']]
          print('matrix=' + json.dumps({'id': ids}))
          print('site_branch=' + cfg['site_branch'])
          " >> $GITHUB_OUTPUT

  # ── Step 2: fetch data for each site in parallel ──────────────────────────
  fetch:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch RSS feeds
        shell: bash
        run: |
          python scripts/build.py --site ${{ matrix.id }} 2>&1 | tee /tmp/build-${{ matrix.id }}.log || true
          grep -oE 'Wrote [0-9]+ new articles' /tmp/build-${{ matrix.id }}.log | grep -oE '[0-9]+' > /tmp/articles.txt || true
          grep 'WARN' /tmp/build-${{ matrix.id }}.log > /tmp/warnings.txt || true

      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_sites/
          if git diff --cached --quiet; then
            echo "No new data for ${{ matrix.id }}"
          else
            git commit -m "Data ${{ matrix.id }} $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

  # ── Step 3: render all sites + portal, push to site branch ───────────────
  render:
    needs: [setup, fetch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main   # pull latest data committed by fetch jobs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout site branch
        shell: bash
        run: |
          BRANCH="${{ needs.setup.outputs.site_branch }}"
          git clone --branch "$BRANCH" --depth=1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            site || {
            # Branch doesn't exist yet: create an empty one
            mkdir -p site
            cd site
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan "$BRANCH"
            git reset --hard
            echo "# $BRANCH" > README.md
            git add README.md
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "init $BRANCH"
            git push origin "$BRANCH"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render all sites
        shell: bash
        run: |
          python -c "
          import json
          cfg = json.load(open('config.json'))
          print(' '.join(s['id'] for s in cfg['sites']))
          " | tr ' ' '\n' | while read site_id; do
            echo "--- Rendering $site_id ---"
            python scripts/render.py --site "$site_id" site 2>&1 | tee -a /tmp/render.log
          done

      - name: Commit and push to site branch
        id: push
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html */index.html */archive robots.txt sitemap.xml feed.xml data.json llms.txt 2>/dev/null || true
          git add . 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "published=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Nightly update $(date -u +%Y-%m-%d)"
            git push origin ${{ needs.setup.outputs.site_branch }}
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Write Job Summary
        if: always()
        run: |
          RENDER=$(cat /tmp/render.log 2>/dev/null || echo "No render log")
          {
            echo "## Industry Watch — nightly update $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 🌐 Site branch | ${{ needs.setup.outputs.site_branch }} |"
            echo "| 🌐 Published | ${{ steps.push.outputs.published || 'n/a' }} |"
            echo ""
            echo "### Render log"
            echo '```'
            echo "$RENDER"
            echo '```'
            if [ "${{ steps.push.outputs.published }}" = "true" ]; then
              echo "### ✅ Published"
            else
              echo "### ℹ️ No change"
            fi
          } >> $GITHUB_STEP_SUMMARY
