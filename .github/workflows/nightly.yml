name: Nightly site update

on:
  schedule:
    - cron: "0 3 * * *"   # every night at 03:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts, sources.json, data/)
        uses: actions/checkout@v5

      - name: Checkout SiteWeb (published branch)
        uses: actions/checkout@v5
        with:
          ref: SiteWeb
          path: site

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Step 1: fetch RSS feeds -> data/YYYY/MM/DD.json, stored on main
      - name: Fetch RSS feeds
        shell: bash   # enables pipefail so a script failure is not masked by tee
        run: python scripts/build.py 2>&1 | tee /tmp/build.log

      - name: Commit data to main
        id: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Data $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      # Step 2: render rolling 30-day index + monthly archive pages -> SiteWeb
      - name: Render site
        shell: bash
        run: python scripts/render.py site 2>&1 | tee /tmp/render.log

      - name: Commit and push to SiteWeb
        id: push
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive
          if git diff --cached --quiet; then
            echo "published=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Nightly update $(date -u +%Y-%m-%d)"
            git push origin SiteWeb
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Write Job Summary
        if: always()
        run: |
          {
            echo "## Petfood Watch — nightly update $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### 1. RSS fetch"
            echo '```'
            cat /tmp/build.log 2>/dev/null || echo "No fetch log (step did not run)"
            echo '```'
            echo "Data committed to **main**: ${{ steps.data.outputs.committed || 'n/a' }}"
            echo ""
            echo "### 2. Site render"
            echo '```'
            cat /tmp/render.log 2>/dev/null || echo "No render log (step did not run)"
            echo '```'
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "### ❌ Failed"
              echo "See the step logs above."
            elif [ "${{ steps.push.outputs.published }}" = "true" ]; then
              echo "### ✅ Published"
              echo "Site pushed to branch **SiteWeb**: https://ibmphilippecabel.github.io/petfood-watch/"
            else
              echo "### ℹ️ No change"
              echo "Nothing changed — nothing was pushed to SiteWeb."
            fi
          } >> $GITHUB_STEP_SUMMARY
