name: Automatic Site Update

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:       # manual run from the Actions tab

# No permission by default: each job declares the ones it needs.
permissions: {}

# One run at a time: two runs would push to main / the site branch at the same moment.
# A run already in progress is never cancelled (it may be committing data); a waiting one is replaced.
concurrency:
  group: site-update
  cancel-in-progress: false

# Third-party actions are pinned to a commit SHA (a tag can be moved, a SHA cannot).
# Dependabot (.github/dependabot.yml) proposes the updates.
#   actions/checkout       fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
#   actions/setup-python   ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0

jobs:
  # ── Step 1: build matrix of site ids from config.json ────────────────────
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      site_branch: ${{ steps.read.outputs.site_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Read config.json
        id: read
        run: |
          python -c "
          import json, os
          cfg = json.load(open('config.json'))
          ids = [s['id'] for s in cfg['sites']]
          print('matrix=' + json.dumps({'id': ids}))
          print('site_branch=' + cfg['site_branch'])
          " >> $GITHUB_OUTPUT

  # ── Step 2: fetch data for each site in parallel ──────────────────────────
  fetch:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # pushes the data to main
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # A failure on one site must not block the others: this step never fails by itself.
      # It records the exit code of build.py; the data is committed next, and the job is
      # failed only in the last step (so partial data is never lost).
      # GROQ_API_KEY is given to this step only (it is the only one that calls Groq).
      - name: Fetch RSS feeds
        id: fetch
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          LOG=/tmp/build-${{ matrix.id }}.log
          rc=0
          # `shell: bash` runs with -eo pipefail: rc is build.py's (not tee's), and every grep
          # that may match nothing needs `|| true` or it would abort this step.
          # The sed defuses any line starting with "::" (feed or AI text could otherwise
          # be read by the runner as a workflow command); the unfiltered text stays in $LOG.
          python scripts/build.py --site ${{ matrix.id }} 2>&1 | tee "$LOG" | sed -u 's/^[[:space:]]*::/> ::/' || rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT

          warns=$(grep '^WARN' "$LOG" | sort -u | head -10 || true)
          n_warn=$(grep '^WARN' "$LOG" | sort -u | wc -l || true)

          # Non-fatal problems (dead feed, Groq error...): warning annotation, job stays green.
          if [ -n "$warns" ]; then
            while read -r line; do
              echo "::warning title=${{ matrix.id }}::$line"
            done <<< "$warns"
          fi
          # Fatal problem (build.py exits non-zero if nothing was fetched or it crashed).
          if [ "$rc" != "0" ]; then
            last=$(grep -E '^(ERROR|Traceback)|Error' "$LOG" | tail -1 || true)
            echo "::error title=${{ matrix.id }} build failed::exit code $rc - ${last:-see log}"
          fi

          {
            echo "### ${{ matrix.id }}"
            if [ "$rc" != "0" ]; then echo "❌ **build failed** (exit code $rc)"; else echo "✅ build ok"; fi
            if [ -n "$warns" ]; then
              echo ""
              echo "⚠️ $n_warn warning(s):"
              echo '```'
              echo "$warns"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit data to main
        if: always() && steps.fetch.outputs.rc != ''
        shell: bash
        run: |
          rc=${{ steps.fetch.outputs.rc }}
          LOG=/tmp/build-${{ matrix.id }}.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_sites/

          title="Data ${{ matrix.id }} $(date -u +%Y-%m-%d)"
          flags=""
          if [ "$rc" != "0" ]; then
            title="$title - BUILD FAILED (exit $rc)"
            flags="--allow-empty"   # a failure changes no file: still leave a trace in the git log
          fi
          body=$(grep -E '^(WARN|ERROR)' "$LOG" | sort -u | head -10 || true)

          if [ -z "$flags" ] && git diff --cached --quiet; then
            echo "No new data for ${{ matrix.id }}"
          else
            git commit $flags -m "$title" -m "${body:-no warning}"
            for attempt in {1..5}; do
              echo "Push attempt $attempt..."
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Push successful!"
                break
              fi
              echo "Push conflict or rejected, retrying in 3s..."
              sleep 3
            done
          fi

      - name: Fail job if the build failed
        if: always() && steps.fetch.outputs.rc != '' && steps.fetch.outputs.rc != '0'
        shell: bash
        run: |
          echo "build.py failed for ${{ matrix.id }} (exit code ${{ steps.fetch.outputs.rc }}); data was committed, other sites are unaffected."
          exit 1

  # ── Step 3: render all sites + portal, push to site branch ───────────────
  render:
    needs: [setup, fetch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # pushes the rendered pages to the site branch
    steps:
      # Code and data come from main; nothing is pushed to main from this job,
      # so the token is not kept in its git config.
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main   # pull latest data committed by fetch jobs
          persist-credentials: false

      # The site branch is checked out by the action (the token goes through git's
      # credential config, not through a URL). It is kept: the push step below uses it.
      - name: Checkout site branch
        id: site
        continue-on-error: true   # the branch does not exist yet on the very first run
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.setup.outputs.site_branch }}
          path: site
          fetch-depth: 1

      # First run only: the site branch does not exist, create it empty.
      - name: Reset site directory (first run only)
        if: steps.site.outcome == 'failure'
        shell: bash
        run: rm -rf site

      - name: Checkout main as base of the new site branch (first run only)
        if: steps.site.outcome == 'failure'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: site

      - name: Create empty site branch (first run only)
        if: steps.site.outcome == 'failure'
        shell: bash
        env:
          BRANCH: ${{ needs.setup.outputs.site_branch }}
        run: |
          cd site
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null
          git clean -fdx
          echo "# $BRANCH" > README.md
          git add README.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "init $BRANCH"
          git push origin "$BRANCH"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Render all sites
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/render_failed.txt
          for site_id in $(python -c "
          import json
          cfg = json.load(open('config.json'))
          print(' '.join(s['id'] for s in cfg['sites']))
          "); do
            echo "--- Rendering $site_id ---"
            # sed: same protection as in the fetch job (a line starting with "::" is a workflow command)
            python scripts/render.py --site "$site_id" site 2>&1 | tee -a /tmp/render.log | sed -u 's/^[[:space:]]*::/> ::/' || echo "$site_id" >> /tmp/render_failed.txt
          done
          # The step itself stays green so that the sites which did render are still published;
          # the job is failed at the very end (last step) if /tmp/render_failed.txt is not empty.

      # GOATCOUNTER_API_KEY is given to this step only.
      - name: Generate stats page
        shell: bash
        continue-on-error: true   # stats are secondary: a crash is shown as a failed step but must not block publication
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          set -o pipefail
          python scripts/stats.py site 2>&1 | tee -a /tmp/render.log | sed -u 's/^[[:space:]]*::/> ::/'

      - name: Commit and push to site branch
        id: push
        env:
          BRANCH: ${{ needs.setup.outputs.site_branch }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html */index.html */archive robots.txt sitemap.xml feed.xml data.json llms.txt 2>/dev/null || true
          git add . 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "published=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Nightly update $(date -u +%Y-%m-%d)"
            git push origin "$BRANCH"
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Write Job Summary
        if: always()
        run: |
          RENDER=$(cat /tmp/render.log 2>/dev/null || echo "No render log")
          {
            echo "## Industry Watch — nightly update $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 🌐 Site branch | ${{ needs.setup.outputs.site_branch }} |"
            echo "| 🌐 Published | ${{ steps.push.outputs.published || 'n/a' }} |"
            echo ""
            echo "### Render log"
            echo '```'
            echo "$RENDER"
            echo '```'
            if [ "${{ steps.push.outputs.published }}" = "true" ]; then
              echo "### ✅ Published"
            else
              echo "### ℹ️ No change"
            fi
            if [ -s /tmp/render_failed.txt ]; then
              echo "### ❌ Render failed for: $(tr '\n' ' ' < /tmp/render_failed.txt)"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if a site could not be rendered
        if: always()
        shell: bash
        run: |
          if [ -s /tmp/render_failed.txt ]; then
            echo "Render failed for: $(tr '\n' ' ' < /tmp/render_failed.txt)"
            exit 1
          fi
